<path d="M390 286V309H285V331" fill="none" stroke="#3b6bdc" stroke-width="2" marker-end="url(#arrow)"/>
<text x="165" y="318" fill="#3b6bdc" font-size="20" font-weight="400" text-anchor="middle">工具 / 模型调用</text>
<path d="M575 286V309H770V331" fill="none" stroke="#3b6bdc" stroke-width="2" marker-end="url(#arrow)"/>
<text x="672" y="301" fill="#3b6bdc" font-size="20" font-weight="400" text-anchor="middle">目标验证</text>
<rect x="590" y="340" width="360" height="250" rx="16" fill="#f8fcf9" stroke="#278a71" stroke-width="1.6" stroke-dasharray="7 6"/>
<text x="770" y="382" fill="#278a71" font-size="24" font-weight="600" text-anchor="middle">可迁移目标验证</text>
<text x="770" y="432" fill="#61718c" font-size="21" font-weight="400" text-anchor="middle">建议：环境契约 / 资源配置</text>
<text x="770" y="468" fill="#61718c" font-size="21" font-weight="400" text-anchor="middle">保留 Docker 目标隔离</text>
<text x="770" y="504" fill="#61718c" font-size="21" font-weight="400" text-anchor="middle">第二阶段：干净环境复跑</text>
<text x="770" y="564" fill="#278a71" font-size="20" font-weight="400" text-anchor="middle">仅隔离目标程序，不隔离宿主模型调用</text>
<rect x="1010" y="340" width="390" height="250" rx="16" fill="#f9fbff" stroke="#3b6bdc" stroke-width="1.6" stroke-dasharray="7 6"/>
<text x="1205" y="382" fill="#3b6bdc" font-size="24" font-weight="600" text-anchor="middle">一致状态与证据账</text>
<text x="1205" y="432" fill="#61718c" font-size="21" font-weight="400" text-anchor="middle">建议：修订身份 / 检查点 / 终态</text>
<text x="1205" y="468" fill="#61718c" font-size="21" font-weight="400" text-anchor="middle">按候选版本核对证据</text>
<text x="1205" y="504" fill="#61718c" font-size="21" font-weight="400" text-anchor="middle">明确旧证据失效与恢复条件</text>
<path d="M956 475H1000" fill="none" stroke="#3b6bdc" stroke-width="2" marker-end="url(#arrow)"/>
<text x="980" y="462" fill="#3b6bdc" font-size="20" font-weight="400" text-anchor="middle">证据</text>
<path d="M1145 334V311H1005V287" fill="none" stroke="#3b6bdc" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1250" y="317" fill="#3b6bdc" font-size="20" font-weight="400" text-anchor="middle">提交与证据绑定</text>
<rect x="40" y="640" width="1360" height="156" rx="16" fill="#fcfaff" stroke="#7757c9" stroke-width="1.6" stroke-dasharray="7 6"/>
<text x="65" y="678" fill="#7757c9" font-size="24" font-weight="600" text-anchor="start">建议建设｜尚未执行</text>
<path d="M477 699L477 779" stroke="#d6cbed" stroke-width="1"/>
<path d="M941 699L941 779" stroke="#d6cbed" stroke-width="1"/>
<text x="65" y="722" fill="#7757c9" font-size="24" font-weight="600" text-anchor="start">恢复与停止控制</text>
<text x="65" y="754" fill="#61718c" font-size="20" font-weight="400" text-anchor="start">优先：检查点恢复 / 拒绝不安全重试</text>
<text x="503" y="722" fill="#7757c9" font-size="24" font-weight="600" text-anchor="start">需求 + 故障评测</text>
<text x="503" y="754" fill="#61718c" font-size="20" font-weight="400" text-anchor="start">后续：功能验收 / 流程完成 / PR交付</text>
<text x="968" y="722" fill="#7757c9" font-size="24" font-weight="600" text-anchor="start">自动证据归档</text>
<text x="968" y="754" fill="#61718c" font-size="20" font-weight="400" text-anchor="start">后续：可迁移路径 / 报告生成</text>
<text x="40" y="834" fill="#61718c" font-size="20" font-weight="400" text-anchor="start">* 建议补充，接口保留不表示改进已完成。概览合并了组件；完整关系见对应 Archify 图。</text>
</g></svg>