<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title"><title id="title">iBoard 建议目标架构（论文概览）</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 1 L7 4.5 L0 8" fill="none" stroke="#3b6bdc" stroke-width="1.5"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2-2 M0 8L8 0 M6 10L10 6" stroke="#dde3ec" stroke-width="1"/></pattern></defs><rect width="1440" height="860" fill="white"/><g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" fill="#162a4b">
<text x="40" y="40" fill="#162a4b" font-size="28" font-weight="650" text-anchor="start">(b) 建议目标架构｜所有调整均待实现与验证</text>
<text x="40" y="80" fill="#61718c" font-size="21" font-weight="400" text-anchor="start">保留执行与交付基础；先解决终审、状态与恢复，再验证需求开发和可迁移性。</text>
<rect x="40" y="130" width="210" height="150" rx="12" fill="#f0f5fe" stroke="#3b6bdc" stroke-width="1.6"/>
<text x="145.0" y="173" fill="#3b6bdc" font-size="24" font-weight="600" text-anchor="middle">任务输入</text>
<text x="145.0" y="212" fill="#61718c" font-size="20" font-weight="400" text-anchor="middle">指定需求 / 故障</text>
<text x="145.0" y="241" fill="#61718c" font-size="20" font-weight="400" text-anchor="middle">Issue + 输入材料</text>
<rect x="310" y="130" width="330" height="150" rx="12" fill="#efeafb" stroke="#7757c9" stroke-width="1.6"/>
<text x="475.0" y="173" fill="#7757c9" font-size="24" font-weight="600" text-anchor="middle">任务协议与项目适配</text>
<text x="475.0" y="212" fill="#61718c" font-size="20" font-weight="400" text-anchor="middle">建议调整：项目规则分离</text>
<text x="475.0" y="241" fill="#61718c" font-size="20" font-weight="400" text-anchor="middle">保留 feature / bug 分支</text>
<rect x="770" y="130" width="290" height="150" rx="12" fill="#eaf6ef" stroke="#278a71" stroke-width="1.6"/>
<text x="915.0" y="173" fill="#278a71" font-size="24" font-weight="600" text-anchor="middle">有界独立审查</text>
<text x="915.0" y="212" fill="#61718c" font-size="20" font-weight="400" text-anchor="middle">建议：分项审查与限额</text>
<text x="915.0" y="241" fill="#61718c" font-size="20" font-weight="400" text-anchor="middle">完整覆盖清单</text>
<rect x="1170" y="130" width="230" height="150" rx="12" fill="#fff4e5" stroke="#c57a28" stroke-width="1.6"/>
<text x="1285.0" y="173" fill="#c57a28" font-size="24" font-weight="600" text-anchor="middle">GitHub PR</text>
<text x="1285.0" y="212" fill="#61718c" font-size="20" font-weight="400" text-anchor="middle">保留门禁与远端核对</text>
<text x="1285.0" y="241" fill="#61718c" font-size="20" font-weight="400" text-anchor="middle">按任务策略交付</text>
<path d="M256 205H300" fill="none" stroke="#3b6bdc" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M646 205H760" fill="none" stroke="#3b6bdc" stroke-width="2" marker-end="url(#arrow)"/>
<text x="703" y="189" fill="#3b6bdc" font-size="20" font-weight="400" text-anchor="middle">阶段调度</text>
<path d="M1066 205H1160" fill="none" stroke="#3b6bdc" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1115" y="189" fill="#3b6bdc" font-size="20" font-weight="400" text-anchor="middle">验收后</text>
