<text x="170" y="440" fill="#278a71" font-size="24" font-weight="600" text-anchor="middle">Claude Code</text>
<text x="170" y="473" fill="#61718c" font-size="20" font-weight="400" text-anchor="middle">错误分类 / 用量回执*</text>
<rect x="65" y="519" width="210" height="50" rx="9" fill="#f0f4fc" stroke="#3b6bdc" stroke-width="1.6"/>
<text x="170" y="552" fill="#3b6bdc" font-size="20" font-weight="550" text-anchor="middle">HTTP 审查 / 视觉</text>
<rect x="350" y="427" width="155" height="123" rx="11" fill="#edf3fc" stroke="#3b6bdc" stroke-width="1.6"/>
<text x="427.5" y="470" fill="#3b6bdc" font-size="26" font-weight="600" text-anchor="middle">GLM</text>
<text x="427.5" y="510" fill="#61718c" font-size="22" font-weight="400" text-anchor="middle">模型服务</text>
