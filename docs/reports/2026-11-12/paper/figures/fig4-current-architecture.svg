<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title"><title id="title">iBoard 当前架构（论文概览）</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 1 L7 4.5 L0 8" fill="none" stroke="#3b6bdc" stroke-width="1.5"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2-2 M0 8L8 0 M6 10L10 6" stroke="#dde3ec" stroke-width="1"/></pattern></defs><rect width="1440" height="860" fill="white"/><g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" fill="#162a4b">
<text x="40" y="40" fill="#162a4b" font-size="28" font-weight="650" text-anchor="start">(a) 当前架构｜公开执行骨架与本地实验分开</text>
<text x="40" y="80" fill="#61718c" font-size="21" font-weight="400" text-anchor="start">需求与故障采用不同验收分支，共用模型执行、隔离测试、证据审查与 PR 交付。</text>
